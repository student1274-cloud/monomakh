/*q*/.q{position:relative}
.q::before{content:"«";position:absolute;left:-.62em;top:0;font-style:italic;color:var(--muted)}
h1,h2,.drop::first-letter{font-family:'Ancient Kyiv','Bookman Old Style',Georgia,serif;font-weight:400}
.page{width:min(980px,70vw);margin:0 auto;padding:40px 0 64px}
.hero{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:28px 48px;padding:32px 0 56px;text-align:center}
.hero h1{font-size:clamp(2.4rem,7vw,4.2rem);line-height:1.08;margin:0 0 14px;color:var(--cin)}
.hero p{margin:0;max-width:30ch;color:var(--muted);font-style:italic;font-size:1.15rem}
.hero .txt{flex:1 1 300px;max-width:520px}
.sealbtn{all:unset;cursor:pointer;display:block;position:absolute;right:-38px;bottom:-30px;width:132px;height:132px;transform:rotate(-8deg);filter:drop-shadow(0 6px 8px rgba(0,0,0,.45))}
.sealbtn:focus-visible{outline:3px solid var(--gold);outline-offset:6px;border-radius:50%}
.sealbtn img{width:100%;height:100%;display:block;border-radius:50%;object-fit:cover}
.portrait{margin:0 0 34px;position:relative;flex:none;width:min(270px,68vw)}
.portrait img.pic{display:block;width:100%;height:auto;border:3px solid var(--gold);outline:1px solid var(--gold);outline-offset:5px;box-shadow:0 10px 24px rgba(0,0,0,.3)}
.portrait figcaption{margin-top:16px;font-size:.82rem;font-style:italic;color:var(--muted);line-height:1.4;max-width:230px}
.stamp{animation:stamp .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stamp{0%{transform:rotate(-20deg) scale(1.9);opacity:0}60%{opacity:1}100%{transform:rotate(-8deg) scale(1);opacity:1}}
.rule{display:flex;align-items:center;gap:14px;color:var(--gold);margin:0 auto 40px;max-width:none}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:var(--gold)}
.sec{margin:0 0 72px}
.sechead{display:flex;align-items:center;gap:20px;margin-bottom:26px;border-bottom:1px solid var(--line);padding-bottom:16px}
.emb{width:78px;height:78px;flex:none;border-radius:50%;background:var(--paper);border:2px solid var(--gold);padding:10px;color:var(--cin)}
.emb svg{width:100%;height:100%}
.sechead h2{margin:0;font-size:clamp(1.9rem,5vw,2.8rem);color:var(--cin);line-height:1.1}
.row{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px 36px;padding:22px 26px;margin-bottom:18px;background:var(--paper);border:1px solid var(--line);border-radius:3px;box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5px var(--line)}
.q{margin:0;font-size:1.3rem;font-style:italic;line-height:1.6}
.drop::first-letter{float:left;font-style:normal;font-size:3.6em;line-height:.85;padding:.06em .1em 0 0;color:var(--cin)}
.gloss{margin:0;align-self:center;padding-left:22px;border-left:1px dashed var(--gold);font-size:.98rem;color:var(--muted);line-height:1.55}
.gloss b{display:block;color:var(--cin);font-weight:700;margin-bottom:2px}
.draw{text-align:center;padding:36px 22px;background:var(--paper);border:1px solid var(--line);border-radius:3px}
.draw h2{margin:0 0 6px;font-size:2.4rem;color:var(--cin)}
.draw .sub{margin:0 0 20px;color:var(--muted)}
.draw button{font:inherit;font-family:'Ancient Kyiv',Georgia,serif;font-size:1.3rem;letter-spacing:.05em;cursor:pointer;padding:12px 28px;color:var(--sealtext);background:var(--seal);border:2px solid var(--gold);border-radius:999px}
.draw button:hover{filter:brightness(1.12)}
.draw button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#pick{min-height:5.2em;margin:26px auto 0;max-width:34ch;font-size:1.4rem;font-style:italic;line-height:1.5}
footer{margin-top:56px;text-align:center;color:var(--muted);font-size:.95rem}
footer small{display:block;margin-top:8px;font-size:.82rem}
@media (max-width:680px){.row{grid-template-columns:1fr;padding:20px}.gloss{padding:10px 0 0;border-left:0;border-top:1px dashed var(--gold)}.sechead{gap:14px}.emb{width:62px;height:62px;padding:8px}.hero{text-align:center}.hero p{margin:0 auto}}
@media (max-width:1100px){.row{grid-template-columns:1fr;padding:20px}.gloss{padding:10px 0 0;border-left:0;border-top:1px dashed var(--gold)}}
@media (max-width:900px){body{background-size:150% auto}.page{width:auto;padding:40px 22px 64px}}
@media (min-width:1100px){.hero h1{font-size:6.7vw}.hero h1 span{display:block;white-space:nowrap}.hero .txt{max-width:none;flex:1 1 0}}
@media (min-width:1500px){body{font-size:22px}.page{width:min(1300px,68vw)}.sechead h2{font-size:3.6rem}.emb{width:96px;height:96px}.portrait{width:300px}.portrait figcaption{font-size:1.05rem;max-width:280px}.sealbtn{width:150px;height:150px}.hero p{font-size:1.8rem;max-width:none;line-height:1.5}.q{font-size:1.75rem;line-height:1.55}.gloss{font-size:1.3rem;line-height:1.5}.row{padding:28px 34px;gap:14px 44px}.draw .sub{font-size:1.3rem}#pick{font-size:1.9rem;max-width:40ch}footer{font-size:1.15rem}footer small{font-size:1rem}.draw button{font-size:1.6rem}}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}}
</style>
</head>
